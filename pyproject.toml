[project]
name = "ocr-web-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omar Polat", email = "polat.omar2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "torch==2.12.0+cu130",
    "torchvision==0.27.0+cu130",
]

[project.scripts]
ocr-web-app = "ocr_web_app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
