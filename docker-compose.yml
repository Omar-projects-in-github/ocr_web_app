services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ocr_backend
    restart: unless-stopped

    environment:
      VLLM_API_BASE: http://vllm:8000/v1
      VLLM_MODEL_NAME: chandra
      VLLM_API_KEY: dummy
      MAX_OUTPUT_TOKENS: 12384

    expose:
      - "8002"

    depends_on:
      vllm:
        condition: service_healthy

  vllm:
    image: vllm/vllm-openai:latest
    container_name: ocr_vllm
    restart: unless-stopped

    command:
      - "--model"
      - "/models/chandra"
      - "--served-model-name"
      - "chandra"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.3"
      - "--max-num-seqs"
      - "1"

    volumes:
      - /home/omar_polat/projects/ocr_project/chandra_ocr_2/model:/models/chandra:ro

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8000/v1/models"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
              - "0"
            capabilities:
              - gpu

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ocr_frontend
    restart: unless-stopped

    environment:
      OCR_API_URL: http://backend:8002/ocr
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: 20

    depends_on:
      - backend

    expose:
      - "8501"

  nginx:
    image: nginx:1.27-alpine
    container_name: ocr_nginx
    restart: unless-stopped

    depends_on:
      - frontend

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ocr_ngrok
    restart: unless-stopped

    depends_on:
      - nginx

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "nginx:80"

    ports:
      - "127.0.0.1:4041:4040"